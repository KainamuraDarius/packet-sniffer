[project]
name = "packet-sniffer"
version = "1.1.0"
description = "An educational network packet sniffer built on Scapy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scapy>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sniffer = "sniffer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
